name: Deploy Instance to VPS

on:
  push:
    branches:
      - instance
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            echo "🚀 Début du déploiement sur le VPS..."
            cd /home/ubuntu/wanderer
            
            echo "📥 Récupération des dernières modifications..."
            git fetch origin instance
            git reset --hard origin/instance
            
            echo "🐳 Reconstruction et redémarrage des conteneurs..."
            docker compose up -d --build
            
            echo "🧹 Nettoyage des anciennes images inutilisées..."
            docker image prune -f
            
            echo "✅ Déploiement terminé avec succès !"
